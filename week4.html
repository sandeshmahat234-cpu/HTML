<!DOCTYPE html>
<html>
<head>
  <title>John Smith</title>
  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", serif;
    }

    /* Navigation bar */
    #navbar {
      background-color: #412121;
      padding: 15px;
      text-align: center;
    }

    #navbar img {
      margin-right: 60px;
    }

    #navbar a {
      color: rgb(88, 88, 182);
    }

    /* Profile box */
    #profile {
      width: 300px;
      margin: 35px auto;
      padding: 15px;
      background-color: rgb(244, 239, 239);
      border: 1px solid black;
      text-align: center;
    }

    h1 {
      color: darkblue;
    }

    h2 {
      color: darkgreen;
    }

    #profile img {
      border: 2px solid black;
    }

    ul {
      text-align: left;
      width: 100px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div id="navbar">
    <img src="logo.png" alt="Logo" width="40">
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#website">Website</a>
  </div>

  <div id="profile">
    <h1>Sandesh Mahat</h1>
    <img src="student.jpg" alt="Student Photo" width="80">

    <h2 id="about">About Me</h2>
    <p>Hello! My name is John Smith. I am a computer science student and I am learning HTML, CSS and JavaScript.</p>

    <h2 id="skills">My Skills</h2>
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>C#</li>
    </ul>

    <h2 id="website">My Website</h2>
    <p><a href="https://www.example.com">Visit My Website</a></p>
  </div>

</body>
</html>
